<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0f3d3e" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a2b2c" />
    <link rel="icon" href="/icono.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/inter-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>ASOTRACMET · Enturnamiento</title>
    <script>
      // Tema elegido en SelectorTema (localStorage): se aplica antes del primer pintado para
      // que no haya destello de papel claro en modo oscuro ni al revés.
      try {
        var tema = localStorage.getItem('asotracmet.tema');
        if (tema === 'claro' || tema === 'oscuro') document.documentElement.dataset.tema = tema;
      } catch (e) {
        /* sin almacenamiento: manda la preferencia del sistema */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
