# Producción en un VPS (TASK-0032, spec §18): app (API + web), Postgres y Redis en la misma máquina.
#   cp .env.example .env.prod   # y rellenar AUTH_SECRET, CIFRADO_CLAVE, WEB_URL, CORS_ORIGINS, POSTGRES_PASSWORD
#   docker compose -f infra/compose.prod.yaml --env-file .env.prod up -d --build
# La app aplica las migraciones pendientes al arrancar. Detrás va un proxy con TLS (ver docs/despliegue.md).
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: asotracmet:latest
    restart: unless-stopped
    environment:
      PERSISTENCIA: postgres
      DATABASE_URL: postgres://asotracmet:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}@postgres:5432/asotracmet
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET}
      CIFRADO_CLAVE: ${CIFRADO_CLAVE:?CIFRADO_CLAVE}
      WEB_URL: ${WEB_URL:?WEB_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-${WEB_URL}}
      MENSAJERIA: ${MENSAJERIA:-consola}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Soportes HSEQ (TASK-0043): con S3_BUCKET van al bucket; si no, al volumen `soportes`.
      SOPORTES_DIR: /app/datos/soportes
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      # Ingesta del agente GPS (ADR-0007). Sin token, la ruta responde 401 y no se guarda nada.
      GPS_INGESTA_TOKEN: ${GPS_INGESTA_TOKEN:-}
      GPS_INGESTA_TOKEN_ANTERIOR: ${GPS_INGESTA_TOKEN_ANTERIOR:-}
    ports:
      - '${APP_PORT:-127.0.0.1:3001}:3001'
    volumes:
      - soportes:/app/datos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Agente GPS (ADR-0007, TASK-0064): proceso satélite, misma imagen y otro comando. Se levanta
  # aparte (`--profile gps`) porque es el único que ve las credenciales de las plataformas de los
  # propietarios, y porque una página de GPS caída no debe poder tocar la operación.
  #   docker compose -f infra/compose.prod.yaml --env-file .env.prod --profile gps up -d gps-agente
  # La imagen la construye el servicio `app` (`up -d --build app`): aquí no se vuelve a construir
  # ni se busca en ningún registro.
  gps-agente:
    image: asotracmet:latest
    pull_policy: never
    profiles: ['gps']
    command: ['node', 'scripts/gps-agente.mjs']
    restart: unless-stopped
    # La imagen trae un HEALTHCHECK que consulta :3001; este proceso no escucha en ningún puerto.
    healthcheck:
      disable: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      GPS_API_URL: http://app:3001
      GPS_INGESTA_TOKEN: ${GPS_INGESTA_TOKEN:?GPS_INGESTA_TOKEN}
      GPS_CUENTAS_ARCHIVO: /run/secrets/gps-cuentas.json
      GPS_INTERVALO_MINUTOS: ${GPS_INTERVALO_MINUTOS:-20}
      GPS_TIMEOUT_MS: ${GPS_TIMEOUT_MS:-15000}
      GPS_CONCURRENCIA: ${GPS_CONCURRENCIA:-3}
      GPS_PROVEEDOR_FORZADO: ${GPS_PROVEEDOR_FORZADO:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # El archivo vive en el host (0400, del usuario del contenedor) y nunca en la base ni en git.
      - ${GPS_CUENTAS_ARCHIVO_HOST:-/etc/asotracmet/gps-cuentas.json}:/run/secrets/gps-cuentas.json:ro
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: asotracmet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}
      POSTGRES_DB: asotracmet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U asotracmet']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  soportes:
