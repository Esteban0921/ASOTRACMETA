# Infra local (fase producto). `docker compose -f infra/compose.yaml up -d`
# Hoy la API corre con almacén en memoria; Postgres y Redis se usan para migraciones y el adaptador TASK-0017.
# Puertos del host configurables (TASK-0042): ASOTRACMET_PG_PORT y ASOTRACMET_REDIS_PORT.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asotracmet
      POSTGRES_PASSWORD: asotracmet
      POSTGRES_DB: asotracmet
    ports:
      - '${ASOTRACMET_PG_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U asotracmet']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${ASOTRACMET_REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
